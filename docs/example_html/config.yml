---
# ~/.local/share/proj/html/proj.yml
scripts:
  template_before: scripts/before.lua
  template_after: scripts/after.lua
definitions:
  new:
    requirements:
      local: false
      variables:
        - name: "title"
        - name: "has_date"
        - name: "font_size"
          default: 14
        - name: "background"
          default: "#202020"
    scripts:
      definition_before: scripts/before.lua
      definition_after: scripts/after.lua
    files:
      - source: src/Dockerfile
        target: Dockerfile
      - source: src/Makefile
        target: Makefile
      - source: src/README.md
        target: README.md
      - source: src/index.html
        target: src/index.html
      - source: src/favicon.svg
        target: src/images/favicon.svg
        parse: false

  html:
    requirements:
      local: true
      variables:
        - name: "title"
    files:
      - source: src/index.html
        target: src/{{ .name }}.html

  css:
    requirements:
      local: true
    files:
      - source: src/index.css
        target: src/{{ .name }}.css
        parse: false

  js:
    requirements:
      local: true
    files:
      - source: src/index.js
        target: src/{{ .name }}.js
        parse: false

# ---
# # This is read & parsed by the go template engine. You will have access to variables defined in
# # global so that you can use them for setting defaults etc.
#
# # Name of the template. Should match directory name.
# kind: "example_html"
# # description of the kind of project. Shown in --help or `proj doc` style scenarios
# description: "Tools for managing a static HTML website - no build steps"
#
# # These scripts run before and after anything in the this template happen
# scripts:
#   before: scripts/before.lua
#   after: scripts/after.lua
#
# # each of the things you can call with.
# # `new` will only run iff .proj/config.yml doesn't exist and it uses arg[0] to find which path in
#   # ~/.local/share/proj to use for template root
# # `add` will only work iff .proj/config.yml does exist. it reads from there `template_name` to
# # figure out  what template to use. Maybe it should also include template/path?
