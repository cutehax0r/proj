#       # for now these are variables required to generate the templates/filenames
#       variables:
#         # all have:
#         # - name: the name of the variable in the proj module
#         # - type: data type of the variable (used for prompting & validation)
#         # - default (uses explicitly set value, then global variable, then default).
#         # - options: a list of valid things you can choose from a list instead of freeform
#         # if value isn't set set but is required then you're prompted for it.
#         # it is implied that "kind" and "name" are set.
