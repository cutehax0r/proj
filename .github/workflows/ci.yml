name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          # macOS Sequoia (latest) - arm64 native
          - runner: macos-latest
            os: macOS
            arch: arm64
            go-arch: arm64
          # macOS Sonoma - x86-64
          - runner: macos-15
            os: macOS
            arch: x86-64
            go-arch: amd64
          # Linux - x86-64
          - runner: ubuntu-latest
            os: Linux
            arch: x86-64
            go-arch: amd64
          # Windows - x86-64
          - runner: windows-latest
            os: Windows
            arch: x86-64
            go-arch: amd64
          # Windows - ARM64
          - runner: windows-11-arm
            os: Windows
            arch: arm64
            go-arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install make (Windows only)
        if: runner.os == 'Windows'
        run: choco install make -y
        shell: powershell

      - name: Download dependencies
        run: go mod download

      - name: Build and test
        run: make build && make acceptance
        timeout-minutes: 5

      - name: Upload test results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            bin/
          retention-days: 0
