name: Release on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-release-tag:
    if: github.event.pull_request.merged && contains(github.event.pull_request.title, 'RELEASE:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from PR title
        id: version
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          VERSION=$(echo "$TITLE" | grep -oP 'RELEASE:\s*\K(v[0-9]+\.[0-9]+\.[0-9]+)' || echo "")

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from PR title: $TITLE"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Trigger Release workflow via repository dispatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PAYLOAD=$(jq -n --arg version "$VERSION" '{version: $version}')
          gh api repos/cutehax0r/proj/dispatches \
            -X POST \
            -f event_type="release-tag-created" \
            -f client_payload="$PAYLOAD"
