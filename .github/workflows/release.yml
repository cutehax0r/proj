name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release-tag-created]

permissions:
  contents: write

env:
  VERSION: ${{ github.event.client_payload.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run acceptance tests
        run: make acceptance
        timeout-minutes: 10

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build macOS arm64 binary
        run: make build-macos-arm64

      - name: Build macOS amd64 binary
        run: make build-macos-amd64

      - name: Create macOS arm64 zip
        run: |
          zip -r bin/proj-${{ env.VERSION }}-darwin-arm64.zip bin/proj-darwin-arm64
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-darwin-arm64.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: zip-arm64

      - name: Create macOS amd64 zip
        run: |
          zip -r bin/proj-${{ env.VERSION }}-darwin-amd64.zip bin/proj-darwin-amd64
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-darwin-amd64.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: zip-amd64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            bin/proj-${{ env.VERSION }}-darwin-arm64.zip
            bin/proj-${{ env.VERSION }}-darwin-amd64.zip

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build Linux arm64 binary
        run: make build-linux-arm64

      - name: Build Linux amd64 binary
        run: make build-linux-amd64

      - name: Install nFPM
        uses: secondlife/setup-nfpm@v1
        with:
          version: "v2.35.0"

      - name: Create nfpm config for amd64
        run: |
          cat > nfpm.yaml <<'EOF'
          name: proj
          arch: amd64
          version: ${{ env.VERSION }}
          maintainer: "Your Name <your.email@example.com>"
          description: "Your project description"
          license: MIT
          section: utils
          contents:
            - src: bin/proj-linux-amd64
              dst: /usr/local/bin/proj
          EOF

      - name: Build Linux amd64 deb package
        run: |
          nfpm pkg --packager deb --target bin/proj-${{ env.VERSION }}-linux-amd64.deb
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-linux-amd64.deb | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: deb-amd64

      - name: Build Linux amd64 rpm package
        run: |
          nfpm pkg --packager rpm --target bin/proj-${{ env.VERSION }}-linux-amd64.rpm
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-linux-amd64.rpm | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: rpm-amd64

      - name: Create Linux amd64 zst archive
        run: |
          zstd -c bin/proj-linux-amd64 > bin/proj-${{ env.VERSION }}-linux-amd64.zst
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-linux-amd64.zst | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: zst-amd64

      - name: Create nfpm config for arm64
        run: |
          cat > nfpm.yaml <<'EOF'
          name: proj
          arch: arm64
          version: ${{ env.VERSION }}
          maintainer: "Your Name <your.email@example.com>"
          description: "Your project description"
          license: MIT
          section: utils
          contents:
            - src: bin/proj-linux-arm64
              dst: /usr/local/bin/proj
          EOF

      - name: Build Linux arm64 deb package
        run: |
          nfpm pkg --packager deb --target bin/proj-${{ env.VERSION }}-linux-arm64.deb
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-linux-arm64.deb | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: deb-arm64

      - name: Build Linux arm64 rpm package
        run: |
          nfpm pkg --packager rpm --target bin/proj-${{ env.VERSION }}-linux-arm64.rpm
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-linux-arm64.rpm | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: rpm-arm64

      - name: Create Linux arm64 zst archive
        run: |
          zstd -c bin/proj-linux-arm64 > bin/proj-${{ env.VERSION }}-linux-arm64.zst
          echo "sha256=$(shasum -a 256 bin/proj-${{ env.VERSION }}-linux-arm64.zst | cut -d' ' -f1)" >> $GITHUB_OUTPUT
        id: zst-arm64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            bin/proj-${{ env.VERSION }}-linux-amd64.deb
            bin/proj-${{ env.VERSION }}-linux-amd64.rpm
            bin/proj-${{ env.VERSION }}-linux-amd64.zst
            bin/proj-${{ env.VERSION }}-linux-arm64.deb
            bin/proj-${{ env.VERSION }}-linux-arm64.rpm
            bin/proj-${{ env.VERSION }}-linux-arm64.zst

  create-release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: macos-artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: linux-artifacts

      - name: Create checksums
        run: |
          cd macos-artifacts
          shasum -a 256 *.zip > checksums.txt
          cd ../linux-artifacts
          shasum -a 256 *.deb *.rpm *.zst >> ../macos-artifacts/checksums.txt
          cd ..

      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-artifacts/proj-${{ env.VERSION }}-darwin-arm64.zip
            macos-artifacts/proj-${{ env.VERSION }}-darwin-amd64.zip
            linux-artifacts/proj-${{ env.VERSION }}-linux-amd64.deb
            linux-artifacts/proj-${{ env.VERSION }}-linux-amd64.rpm
            linux-artifacts/proj-${{ env.VERSION }}-linux-amd64.zst
            linux-artifacts/proj-${{ env.VERSION }}-linux-arm64.deb
            linux-artifacts/proj-${{ env.VERSION }}-linux-arm64.rpm
            linux-artifacts/proj-${{ env.VERSION }}-linux-arm64.zst
            macos-artifacts/checksums.txt
          draft: false
          prerelease: false
