name: Update Homebrew Tap

on:
  workflow_run:
    workflows: ["Release on Merge"]
    types: 
      - completed
    branches: [main]

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main project
        uses: actions/checkout@v4
        with:
          repository: cutehax0r/proj
          path: proj

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: cutehax0r/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.AUTOMATED_PUBLISHING_TOKEN }}

      - name: Get latest release info
        id: release-info
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/cutehax0r/proj/releases/latest)
          VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name' | sed 's/^v//')
          echo "Using latest release version: $VERSION"
          ASSET_URL="https://github.com/cutehax0r/proj/archive/refs/tags/v${VERSION}.tar.gz"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "asset_url=$ASSET_URL" >> $GITHUB_OUTPUT

      - name: Calculate SHA256 and validate
        id: sha256
        run: |
          curl -L -o release.tar.gz "${{ steps.release-info.outputs.asset_url }}"
          SHA256=$(shasum -a 256 release.tar.gz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "asset_sha256=$SHA256"
          # Validate SHA256 calculation
          if [ -z "$SHA256" ] || [ ${#SHA256} -ne 64 ]; then
            echo "ERROR: Invalid SHA256 calculation"
            exit 1
          fi

      - name: Update main formula
        run: |
          VERSION="${{ steps.release-info.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          echo "Updating proj.rb to version $VERSION with SHA256 $SHA256"
          sed -i "s|url \".*\"|url \"https://github.com/cutehax0r/proj/archive/refs/tags/v${VERSION}.tar.gz\"|" homebrew-tap/Formula/proj.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" homebrew-tap/Formula/proj.rb

      - name: Create version-specific formula
        run: |
          VERSION="${{ steps.release-info.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          
          # Create class name (e.g., 0.0.6 -> ProjAT006)
          # Remove dots from version for class name: 0.0.6 -> 006
          CLASS_VERSION=$(echo "$VERSION" | tr -d '.')
          
          echo "Creating proj@${VERSION}.rb with class ProjAT${CLASS_VERSION}"
          
          # Copy main formula to version-specific formula
          cp homebrew-tap/Formula/proj.rb homebrew-tap/Formula/proj@${VERSION}.rb
          
          # Update class name (Proj -> ProjAT${CLASS_VERSION})
          sed -i "s/class Proj </class ProjAT${CLASS_VERSION} </" homebrew-tap/Formula/proj@${VERSION}.rb
          
          # The URL and SHA256 are already set correctly from proj.rb

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          repository: homebrew-tap
          commit_author: github-actions[bot] <actions@github.com>
          commit_message: "Update proj formula to v${{ steps.release-info.outputs.version }}"
          branch: main
