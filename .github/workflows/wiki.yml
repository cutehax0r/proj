name: Publish Wiki

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish-wiki:
    if: github.event.pull_request.merged && contains(github.event.pull_request.title, 'RELEASE:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Extract version from PR title
        id: version
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          VERSION=$(echo "$TITLE" | grep -oP 'RELEASE:\s*\K(v[0-9]+\.[0-9]+\.[0-9]+)' || echo "")
          
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from PR title: $TITLE"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Wiki files
        run: make wiki WIKI_OUT_DIR=wiki WIKI_SRC_DIR=doc

      - name: Commit and Push to Wiki
        working-directory: wiki
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to wiki documentation."
            exit 0
          fi
          git commit -m "Update wiki for release ${{ steps.version.outputs.version }}"
          git push
