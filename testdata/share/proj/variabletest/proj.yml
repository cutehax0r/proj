---
description: "Template for testing variable resolution in proj add"
definitions:
  new:
    requirements:
      local: false
      variables:
         - name: appname
         - name: environment
         - name: version
    files:
      - source: src/config.txt
        target: config-{{.appname}}.txt
        parse: true
  
  config:
    requirements:
      local: true
      variables:
         - name: appname
         - name: environment
         - name: version
    files:
      - source: src/config.txt
        target: config-{{.appname}}.txt
        parse: true
