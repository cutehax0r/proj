---
# Test template for static file copying
scripts: {}
definitions:
  new:
    scripts: {}
    requirements:
      local: false
    files:
      - source: readme.md
        target: readme.md
        parse: false
      - source: src/example1.md
        target: readme-example1.md
        parse: false
      - source: src/example2.md
        target: src/example2.md
        parse: false
      - source: src/example3.md
        target: src/foo/bar/example3.md
        parse: false
      - source: src/example4.md
        target: src/example-4-{{.targetname}}.md
        parse: false
      - source: src/example5.md
        target: src/example5.md
        parse: false
      - source: src/example6.sh
        target: example6.sh
        parse: false
  new_alt:
    scripts: {}
    requirements:
      local: false
    files:
      - source: alt_readme.md
        target: readme.md
        parse: false
  text:
    scripts: {}
    requirements:
      local: true
    files:
      - source: plain_text.txt
        target: output.txt
        parse: false
