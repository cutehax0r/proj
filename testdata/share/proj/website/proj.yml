---
# Website Template for Testing Add Command
# This template is used to test the 'proj add' functionality
definitions:
  new:
    requirements:
      local: false
      variables:
        - name: sitename
    files:
      - source: src/index.html
        target: src/index.html
        parse: true
      - source: src/favicon.svg
        target: src/img/favicon.svg
        parse: false
      - source: src/readme.md
        target: readme.md
        parse: false
  
  html:
    requirements:
      local: true
      variables:
        - name: title
    files:
      - source: src/page.html
        target: src/{{.targetName}}.html
        parse: true
  
  css:
    requirements:
      local: true
    files:
      - source: src/style.css
        target: src/css/{{.targetName}}.css
        parse: true
  
  js:
    requirements:
      local: true
    files:
      - source: src/script.js
        target: src/js/{{.targetName}}.js
        parse: true
