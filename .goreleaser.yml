version: 2

project_name: proj

before:
  hooks:
    - go mod download

builds:
  - binary: proj
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - format: zip
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - src: "*"
        dst: "."
    only:
      - darwin

  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - src: "*"
        dst: "."
    only:
      - linux

nfpms:
  - id: deb
    package_name: proj
    homepage: https://github.com/cutehax0r/proj
    maintainer: "cutehax0r <cutehax0r@example.com>"
    description: "A tool for setting up new projects or adding files to existing projects"
    license: MIT
    formats:
      - deb
    architectures:
      - amd64
      - arm64
    bindir: /usr/local/bin

  - id: rpm
    package_name: proj
    homepage: https://github.com/cutehax0r/proj
    maintainer: "cutehax0r <cutehax0r@example.com>"
    description: "A tool for setting up new projects or adding files to existing projects"
    license: MIT
    formats:
      - rpm
    architectures:
      - amd64
      - arm64
    bindir: /usr/local/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: cutehax0r
    repo: proj
  draft: false
  prerelease: false

changelog:
  sort: asc
  use: github-native
