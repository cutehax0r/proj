version: 2

project_name: proj

before:
  hooks:
    - go mod download

builds:
  - binary: proj
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64

archives:
  - format: zip
    format_overrides:
      - goos: linux
        format: tar.gz

nfpms:
  - package_name: proj
    homepage: https://github.com/cutehax0r/proj
    maintainer: "cutehax0r <97819453+cutehax0r@users.noreply.github.com>"
    description: "A tool for setting up new projects or adding files to existing projects"
    license: MIT
    formats:
      - deb
      - rpm

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: false

changelog:
  sort: asc
  use: github-native
